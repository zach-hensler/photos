<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos by Zach Hensler</title>
  </head>
  <body>
    <main>
      <h1>Photos by Zach Hensler</h1>
        <div class="subtitle">
          <p>Click photos to expand</p>
          <div>
              <label htmlFor="collection">Collection: </label>
              <select id="collection" onchange="handleCollectionChange(event)">
                  <option value="Favorites">Favorites</option>
                  <option value="Astro">Astro</option>
                  <option value="Cats">Cats</option>
                  <option value="Colorado Springs">Colorado Springs</option>
                  <option value="Floral">Floral</option>
                  <option value="Manistee River">Manistee River</option>
                  <option value="Metea">Metea</option>
                  <option value="Wildlife">Wildlife</option>
              </select>
          </div>
      </div>
      <div id="image-container">
      </div>
      <dialog id="expanded-dialog" onclick="closeExpandedDialog()">
        <img id="dialog-image"/>
      </dialog>
    </main>
    <footer>
      <div class="footer-links">
        <a href="https://zach-hensler.com">Site Map</a>
      </div>
    </footer>
  </body>
  <script>
    function hydrateImages(collectionName) {
      let collection = [];
      switch(collectionName) {
        case "Favorites":
          collection = favorites;
          break;
        case "Astro":
          collection = astro;
          break;
        case "Cats":
          collection = cats;
          break;
        case "Colorado Springs":
          collection = colorado_springs;
          break;
        case "Floral":
          collection = floral;
          break;
        case "Manistee River":
          collection = manistee_river;
          break;
        case "Metea":
          collection = metea;
          break;
        case "Wildlife":
          collection = wildlife;
          break;
      }

      const container = document.getElementById("image-container");
      // remove all previous images
      while (container.hasChildNodes()) {
        container.removeChild(container.firstChild);
      }

      // hydrate new images
      for (const image of collection) {
        const newImg = document.createElement("img")
        newImg.src = "smallest/" + image.file;
        newImg.className = "image";
        newImg.onclick = () => openExpandedDialog(image.file)
        newImg.onload= () => {
          newImg.onload=null;
          newImg.src=`medium/${image.file}`;
        }

        container.appendChild(newImg);
      }
    }

    function handleCollectionChange(event) {
      hydrateImages(event.target.value)
    }

    function openExpandedDialog(src) {
      const dialogImg = document.getElementById("dialog-image");

      // Medium image should already be cached from page load
      dialogImg.src = "medium/" + src;
      dialogImg.onload= () => {
        dialogImg.onload=null;
        dialogImg.src=`full/${src}`;
      }

      const dialog = document.getElementById("expanded-dialog");
      dialog.className = "";
      dialog.showModal();
    }

    function closeExpandedDialog() {
      const dialog = document.getElementById("expanded-dialog");
      dialog.className = "hidden";
      dialog.close();

      const dialogImg = document.getElementById("dialog-image");
      dialogImg.src = "";
    }
